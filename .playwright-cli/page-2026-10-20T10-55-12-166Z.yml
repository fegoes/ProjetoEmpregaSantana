  - generic [ref=f6e82]:
    - heading "O que nossos clientes estão dizendo" [level=2] [ref=f6e83]
    - generic [ref=f6e85]:
      - list [ref=f6e87]:
        - listitem [ref=f6e88]:
          - generic [ref=f6e89]: "\" Muito bom site para quem busca profissionais de diversos segmentos e especialização. Depois que você faz um projeto com esse site, você se pergunta: como eu trabalhava sem esse site? Valeu muito a pena! \""
          - generic [ref=f6e90]: "- Rafael Leite"
        - listitem [ref=f6e92]:
          - generic [ref=f6e93]: "\" Dentre as plataformas de freelas, a 99 foi a que tem a maior base de respostas entre propostas de freelas. O nível da base de dados de profissionais disponíveis é muito acima do esperado. Sobre a plataforma, é necessário apenas alguns ajustes de respostas nas informações. Mas a plataforma é limpa e objetiva. Parabéns ao 99Freelas. \""
          - generic [ref=f6e94]: "- Lincoln Tamashiro"
        - listitem [ref=f6e96]:
          - generic [ref=f6e97]: "\" O 99Freelas foi um achado. Já conhecia o site há certo tempo mas não acreditava em sua eficiência. Como tenho muitas demandas passei a ser um usuário permanente. Todas as propostas foram bem elaboradas, os profissionais mostram ser plenamente competentes. \""
          - generic [ref=f6e98]: "- Jorge Medeiros"
        - listitem [ref=f6e100]:
          - generic [ref=f6e101]: "\" Pela primeira vez que utilizei o site, tive uma excelente experiência e com certeza recomendo o 99Freelas pela rapidez no suporte ao usuário, segurança no processo o qual é feito dentro do site e plataforma incrível de trabalho. Site hiper recomendado. \""
          - generic [ref=f6e102]: "- Vanessa Custodio"
