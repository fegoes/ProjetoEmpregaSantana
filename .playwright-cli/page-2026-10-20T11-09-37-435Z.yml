                  - heading "Descrição da vaga" [level=2] [ref=f86e67]
                  - generic [ref=f86e68]:
                    - paragraph [ref=f86e69]:
                      - strong [ref=f86e70]: Conheça mais sobre a gente!
                    - paragraph [ref=f86e71]: "Nosso propósito é claro: impulsionar o potencial humano. Acreditamos que, com tecnologia e inovação, podemos transformar a forma como pessoas e empresas se conectam. Somos a AI Talent Platform nº 1 para gestão de pessoas no Brasil, com uma jornada completa que vai do recrutamento ao desenvolvimento e acompanhamento, agora com agentes de IA e dados centralizados atuando de forma integrada."
                    - paragraph [ref=f86e72]: Na Gupy, estimulamos o desenvolvimento contínuo em um ambiente com desafios reais, autonomia, colaboração entre áreas e espaço para inovar. O aprendizado faz parte do dia a dia e é potencializado por times diversos e colaborativos, que acreditam no poder das conexões genuínas.
                    - paragraph [ref=f86e73]: Para nós, diversidade é muito importante! Se você pertence a um grupo diverso, saiba que todas as nossas vagas são abertas para você. Queremos construir um time cada vez mais inclusivo, onde todos possam crescer e contribuir de forma única.
                    - paragraph [ref=f86e74]: Fazer parte da Gupy é criar o futuro do trabalho com propósito, tecnologia e impacto real na vida das pessoas.
                    - paragraph [ref=f86e75]
                - generic [ref=f86e76]:
                  - heading "Responsabilidades e atribuições" [level=2] [ref=f86e77]
                  - generic [ref=f86e78]:
                    - paragraph [ref=f86e79]: Buscamos um profissional para atuar nos projetos de Integração entre sistema de nossos clientes, de forma que os requisitos funcionais e não-funcionais sejam descritos e implementados. Sua missão será garantir que o ecossistema de ferramentas de RH (Core HR, Recrutamento, Performance, Folha de Pagamento) esteja perfeitamente conectado, automatizando fluxos de dados e otimizando a experiência do colaborador através de integrações eficientes e seguras.
                    - paragraph [ref=f86e80]:
                      - strong [ref=f86e81]: 📌 Responsabilidades e Atribuições
                    - list [ref=f86e82]:
                      - listitem [ref=f86e83]: "Levantamento de Requisitos: Traduzir necessidades das áreas de RH em especificações técnicas de integração (mapeamento de campos, lógica de transformação e periodicidade)."
                      - listitem [ref=f86e84]: "Gestão do Ecossistema: Sustentar e monitorar as integrações entre o ERP/Folha e plataformas especialistas (Ex: Gupy, Workday, SuccessFactors, RM Totvs, Senior, etc.)."
                      - listitem [ref=f86e85]: "Documentação Técnica: Elaborar e manter atualizados os diagramas de fluxos de dados e dicionários de dados (data mapping)."
                      - listitem [ref=f86e86]: "Desenvolvimento: Implementar as integrações através de plataformas no/low-code."
                      - listitem [ref=f86e87]: "QA e Testes: Planejar e executar testes de integração (UAT), garantindo a integridade dos dados e o tratamento de exceções/erros."
                      - listitem [ref=f86e88]: "Interface com Stakeholders: Ser o elo entre o time técnico e o RH de nossos clientes, garantindo a tradução para os diferentes stakeholders."
                      - listitem [ref=f86e89]: "Melhoria Contínua: Identificar gargalos em processos manuais e propor automações que reduzam o esforço operacional do time de RH."
                - generic [ref=f86e90]:
                  - heading "Requisitos e qualificações" [level=2] [ref=f86e91]
                  - generic [ref=f86e92]:
                    - paragraph [ref=f86e93]:
                      - strong [ref=f86e95]: "Como requisitos básicos, você deve ter:"
                    - list [ref=f86e96]:
                      - listitem [ref=f86e97]: "Domínio Técnico de Integrações: Experiência prática com APIs (REST/SOAP), formatos de arquivos (JSON, XML, CSV) e ferramentas de transferência de arquivos (SFTP)."
                      - listitem [ref=f86e98]: "Conhecimento em SQL: Capacidade de realizar consultas para validação de dados e geração de relatórios simples."
                      - listitem [ref=f86e99]: "Visão de LGPD: Entendimento crítico sobre segurança da informação e privacidade de dados sensíveis de colaboradores."
                      - listitem [ref=f86e100]: "Metodologias Ágeis: Familiaridade com Scrum ou Kanban para gestão de demandas."
                      - listitem [ref=f86e101]: Inglês técnico para leitura de documentações e suporte com softwares globais.
                    - paragraph [ref=f86e102]:
                      - strong [ref=f86e103]: "Você se destaca, se tiver:"
                    - list [ref=f86e104]:
                      - listitem [ref=f86e105]: "Experiência com ferramentas de iPaaS (Ex: Digibee, Workato, Dell Boomi, Mulesoft) ou plataformas de automação (N8N, Make, Power Automate)."
                      - listitem [ref=f86e106]: "Experiência com HRIS: Conhecimento funcional de processos de RH (Recrutamento e Seleção, Admissão, Perfomance, Engajamento, Treinamento e Estrutura Organizacional)."
                      - listitem [ref=f86e107]: Vivência em projetos de integração de grandes empresas com sistemas de folha.
                      - listitem [ref=f86e108]: Espanhol e Inglês.
                    - paragraph [ref=f86e109]:
                      - strong [ref=f86e110]: Acha que não preenche todos os requisitos?
                    - paragraph [ref=f86e111]: Um estudo recente do LinkedIn indicou que mulheres são menos propensas a se candidatarem a vagas se não acreditarem que preenchem 100% das qualificações (em comparação, homens tendem a se inscrever mesmo atendendo a 60%).
                    - paragraph [ref=f86e112]: Aqui na Gupy, queremos construir um ambiente de trabalho cada vez mais diverso e inclusivo. Portanto, se você gostou e se identificou com a vaga, mas a sua experiência
                    - paragraph [ref=f86e113]: prévia não se alinha exatamente com todos os requisitos descritos, te incentivamos a se candidatar de qualquer maneira.
                    - paragraph [ref=f86e114]: Você pode ser a pessoa certa e não queremos perder a chance de te conhecer.
