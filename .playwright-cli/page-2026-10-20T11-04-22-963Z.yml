          - paragraph [ref=f52e808]: "A Camisaria FMW está buscando uma Costureira qualificada para integrar nossa equipe. Se você tem experiência em costura, atenção aos detalhes e busca um ambiente de trabalho dinâmico, essa oportunidade pode ser para você! A profissional será responsável por seguir os padrões de produção e atender aos prazos estabelecidos, realizando ajustes em peças como ternos, camisas sociais, calças jeans, calças de sarja, entre outras. Entre as atividades estão a realização de barras de calça e paletó, ajustes de punhos, entrepernas, cós e pernas das calças, além de subir mangas de paletó, acinturar camisas e realizar outros ajustes de modelagem. Também será responsável pela passadoria das peças, garantindo um acabamento de qualidade, além de manter o local de trabalho limpo e organizado, seguindo as normas de segurança e higiene. Buscamos profissionais com experiência prévia como costureira, habilidade em diferentes tipos de costura, tanto manual quanto à máquina, atenção aos detalhes, comprometimento com a qualidade e capacidade de trabalhar de forma independente e em equipe. Oferecemos Day Off no aniversário, Vale-Transporte, cesta básica, treinamento, desconto em faculdades como Anhembi Morumbi e São Judas, desconto nas lojas e auxílio-compra no valor de R$ 150,00. Se você é apaixonada por costura e busca crescimento profissional, venha fazer parte da Camisaria FMW! Benefícios: -. Desconto nas lojas -. Day off no seu aniversário -. Auxilio compra no valor de 150,00 -. Desconto com Faculdades -. Cesta básica -. Vale transporte -. Treinamento"
