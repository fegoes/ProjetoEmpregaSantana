            - heading "Por dentro das áreas" [level=2] [ref=f44e191]
            - paragraph [ref=f44e193]: Aqui você vai entender um pouco mais sobre o nosso time e iniciativas! 💙
            - generic [ref=f44e194]:
              - generic [ref=f44e195]: slide 1 to 2 of 2
              - generic [ref=f44e198]:
                - generic "Depoimento 1 de 2" [ref=f44e199]:
                  - img "Foto de Lyzandra Figueiredo" [ref=f44e201]
                  - generic [ref=f44e202]: Lyzandra Figueiredo
                  - text: Customer Success
                  - paragraph [ref=f44e203]: Trabalhar em SMB na Gupy é uma tarefa encantadora mas com muitos desafios. A nossa rotina está baseada em reuniões com clientes, analises de dados, projetos de melhorias para os clientes e a área em geral. Por termos um alto volume de clientes precisamos pensar sempre em como prestar um atendimento escalável mas sem perder a personalização, precisamos ter um olhar empático e analítico para lidar com as demandas e clientes. É muito gratificante saber que faz parte da mudança do processo de Recrutamento e Seleção de pequenas e médias empresas do Brasil.
                - generic "Depoimento 2 de 2" [ref=f44e204]:
                  - img "Foto de Brenda Santos" [ref=f44e206]
                  - generic [ref=f44e207]: Brenda Santos
                  - text: Gente & Gestão
                  - paragraph [ref=f44e208]: Trabalhar no time de RH é um aprendizado constante. É incrível! Poder atuar na geração de novas oportunidades, no desenvolvimento e no encantamento do time faz essa jornada ser encantadora. Ser Gupy é gostar de gente e ser gente o tempo todo. Se quer um lugar em que pode ser você mesmo e construir uma história, vem com a gente!
        - region "Seção de Depoimentos" [ref=f44e209]:
          - generic [ref=f44e210]:
            - heading "Por dentro da Gupy" [level=2] [ref=f44e211]
            - paragraph [ref=f44e213]: Temos algumas iniciativas bem legais aqui dentro, olha só!
            - generic [ref=f44e214]:
              - generic [ref=f44e215]: slide 1 to 3 of 6
              - generic [ref=f44e218]:
                - generic "Depoimento 1 de 6" [ref=f44e219]:
                  - img "Foto de Grupos de afinidade" [ref=f44e221]
                  - generic [ref=f44e222]: Grupos de afinidade
                  - paragraph [ref=f44e223]: "Trabalhamos para que a Gupy seja sempre um ambiente seguro para todes. Não importa qual o seu marcador de diversidade, o seu recorte ou o seu interesse, temos vários grupos de afinidade aqui dentro para reunir pessoas e criar espaços de debate, desenvolvimento e acolhimento. Alguns dos nossos grupos hoje são: Gupretos (pessoas negras), Gupride (LGBTQIAP+), Girlpiers (mulheres) e Devas (mulheres e pessoas não binárias de tech)."
                - generic "Depoimento 2 de 6" [ref=f44e224]:
                  - img "Foto de Educação corporativa" [ref=f44e226]
                  - generic [ref=f44e227]: Educação corporativa
                  - paragraph [ref=f44e228]: Compartilhar conhecimento é muito importante pra gente! Temos um time referência e precisamos dividir informação o tempo todo. Para isso, usamos a nossa superferramenta de educação corporativa, a Niduu. Todos os gupiers têm acesso ao app e à plataforma para fazer cursos gerais, treinamentos de áreas, aprender sobre a empresa e muito mais! 📚
                - generic "Depoimento 3 de 6" [ref=f44e229]:
                  - img "Foto de Recrutamento interno" [ref=f44e231]
                  - generic [ref=f44e232]: Recrutamento interno
                  - paragraph [ref=f44e233]: Valorizamos muito nosso time e queremos que todo mundo tenha oportunidade de crescer aqui dentro. Por isso, o recrutamento interno é algo muito forte aqui! Inclusive, grande parte das nossas vagas de liderança são fechadas internamente, sabia? 📈
                - generic [aria-hidden] [ref=f44e234]:
                  - generic [ref=f44e237]: Gupy Coin
                  - paragraph [ref=f44e238]: "Criamos um modelo carinhosamente apelidado de Gupy Coin para incentivar o reconhecimento entre os times. Todo mês, os Gupiers recebem um valor em moedas virtuais para doar para outros Gupiers com foco em reconhecer uma atividade, ação e exemplos atrelado a nossa cultura que a pessoa fez! E o melhor: as Gupy Coins que você ganhar podem ser convertidas para diversos produtos em uma loja virtual da Gupy! 💰"
                - generic [aria-hidden] [ref=f44e239]:
                  - generic [ref=f44e242]: DIA T
                  - paragraph [ref=f44e243]: É o nosso Dia de Trabalho para ganhar Tração para o próximo Trimestre. Esse rito aqui da Gupy acontece trimestralmente para que todos os Gupiers foquem energia em desdobramento da estratégia, Team Building e alinhamentos internos entre todos os times. Todo mundo tem autonomia para sugerir formas de ajudar a Gupy a chegar no sonho grande. Depois de tudo definido, fazemos um happy hour, é claro!🥂
                - generic [aria-hidden] [ref=f44e244]:
                  - generic [ref=f44e247]: Treinamento e Desenvolvimento
                  - paragraph [ref=f44e248]: Evolução é muito importante aqui na Gupy, por isso, temos um ciclo de avaliação de desempenho para que os Gupiers decolem ainda mais alto e uma frente de T&D para apoiar o aprendizado e o aprimoramento constante das nossas pessoas! Queremos que todo Gupier cresça e saiba pra onde está crescendo, por isso, incentivamos a criação de PDIs, 1:1 quinzenais e toda uma jornada que olha para performance, cultura, liderança e promoções.
