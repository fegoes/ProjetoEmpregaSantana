<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Post por seções — prévia</title><link rel="icon" href="../assets/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;font:15px/1.85 Poppins,sans-serif;background:white;color:#333;overflow-wrap:anywhere}header{font:700 18px Montserrat;color:#0d3a66;padding:24px;border-bottom:1px solid #ddd}.intro{max-width:768px;margin:auto;padding:40px 24px 20px}h1,h2,h3{font-family:Montserrat;line-height:1.25;letter-spacing:-.025em;text-wrap:balance}h1{font-size:clamp(30px,4vw,42px);margin:0 0 22px;color:#0d3a66}h2{font-size:23px;margin:0 0 18px}.meta{font-size:12px;color:#606060;border-block:1px solid #ddd;padding:16px 0}.section{margin:20px auto;max-width:768px;padding:24px;display:flex;flex-direction:column;justify-content:center}.section[data-width=wide]{max-width:1152px;margin-inline:24px}.section[data-width=screen]{max-width:none;width:100%;margin-inline:0}.section.selected{outline:2px solid #1e63b6;outline-offset:-2px}.content{width:100%;margin-inline:auto;display:flex;flex-direction:column;gap:32px}.block{width:100%;min-width:0}.block p{margin:0 0 16px}.block p:last-child{margin-bottom:0}.block ul{padding-left:24px;margin:0}.block li{margin-block:8px}.block a{color:var(--link);text-underline-offset:4px}.media-grid{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}figure{margin:0}img{width:100%;max-height:480px;object-fit:contain;background:#f4f4f4;display:block;cursor:zoom-in;border-radius:8px}figcaption{font-size:12px;margin-top:10px}.empty,.video-card{padding:28px;border:1px dashed currentColor;border-radius:10px;text-align:center}.video-card strong{display:block;font-family:Montserrat;font-size:18px;margin-bottom:12px}.video-card p{font-size:12px}.embed{width:100%;aspect-ratio:16/9;border:0}.ad{background:white;color:#333;border:1px solid #ddd;padding:24px;border-radius:10px;text-align:left}.ad small{display:block;color:#606060;font-size:11px;margin-bottom:14px}.ad h3{font-size:21px}.action,button{min-height:44px;padding:10px 18px;border-radius:999px;font:500 13px Poppins;cursor:pointer}button{background:white;border:1px solid #bbb;color:#0d3a66}.action{display:inline-flex;align-items:center;text-decoration:none}.slide-tools{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:14px}.slide-tools span{font-size:12px}.slide[hidden]{display:none}.slide-tools button{min-width:44px}.footer{max-width:768px;margin:36px auto 0;padding:24px;font-size:11px;border-top:1px solid #ddd;color:#666}dialog{border:0;border-radius:12px;padding:20px;width:min(96vw,1200px);max-height:95dvh}dialog::backdrop{background:#000b}dialog img{max-height:74dvh}dialog button{margin-bottom:12px}:focus-visible{outline:3px solid #1e63b6;outline-offset:4px}::selection{background:#dceaff;color:#0d3a66}@media(max-width:480px){.intro{padding:30px 20px 10px}.section{margin:16px 20px;padding-inline:20px}.section[data-width=wide]{margin-inline:12px}.media-grid{grid-template-columns:1fr}h1{font-size:30px}.video-card,.ad{padding:20px}}</style><header>EmpregaSantana</header><article><div class="intro"><h1 id="title"></h1><p class="meta">Carreira · Autor de exemplo · Conteúdo ilustrativo</p></div><div id="sections"></div></article><footer class="footer">Estudo local de post por seções. Imagens editoriais ilustrativas existentes no projeto. Sem publicação.</footer><dialog aria-label="Imagem ampliada" id="lightbox"><button id="close">Fechar imagem</button><img id="large" alt=""><div class="slide-tools"><button id="prev">Anterior</button><span id="imageCount"></span><button id="next">Próxima</button></div></dialog><script>
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function url(value){try{const u=new URL(value);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return''}}
function imageUrl(value){return /^blob:/.test(value)?value:url(value)}
function video(raw){const value=url(raw);if(!value)return null;const u=new URL(value),host=u.hostname.replace(/^www\./,'');let id;if(host==='youtu.be')id=u.pathname.slice(1);if(['youtube.com','m.youtube.com'].includes(host))id=u.searchParams.get('v')||u.pathname.match(/^\/(?:shorts|embed)\/([^/]+)/)?.[1];if(id&&/^[\w-]{11}$/.test(id))return{provider:'YouTube',url:value,embed:'https://www.youtube.com/embed/'+id};if(['vimeo.com','player.vimeo.com'].includes(host)){id=u.pathname.match(/(?:\/video)?\/(\d+)/)?.[1];if(id)return{provider:'Vimeo',url:value,embed:'https://player.vimeo.com/video/'+id+u.search}}if(host==='instagram.com'&&/^\/(p|reel|tv)\/[^/]+/.test(u.pathname))return{provider:'Instagram',url:value,embed:null};return null;}
function photo(img){const src=imageUrl(img.desktop),mobile=imageUrl(img.mobile);return src?`<picture>${mobile?`<source media="(max-width:639px)" srcset="${escape(mobile)}">`:''}<img loading="lazy" src="${escape(src)}" alt="${escape(img.alt||'Imagem do conteúdo')}"></picture>`:'<div class="empty">Escolha uma imagem JPG ou PNG no editor.</div>'}
function renderBlock(b,s){let body='';if(b.type==='text')body=b.html;if(b.type==='topics')body='<ul>'+b.items.split('\n').filter(x=>x.trim()).map(x=>'<li>'+escape(x)+'</li>').join('')+'</ul>';if(['image','gallery','slides'].includes(b.type)){if(!b.images.length)body='<div class="empty">Nenhuma imagem neste bloco.</div>';else{body=`<div class="${b.type==='gallery'?'media-grid':'slides'}">`+b.images.map((img,i)=>`<figure class="${b.type==='slides'?'slide':''}" ${b.type==='slides'&&i?'hidden':''} data-photo="${i}">${photo(img)}</figure>`).join('')+'</div>';if(b.type==='slides')body+='<div class="slide-tools"><button data-slide="-1">Anterior</button><span class="slide-count">1 / '+b.images.length+'</span><button data-slide="1">Próximo</button></div>';if(b.caption)body+='<figcaption>'+escape(b.caption)+'</figcaption>';}}
if(b.type==='video'){const v=video(b.url);body=v?`<div class="video-card"><strong>${v.provider}</strong><p>${escape(v.url)}</p>${v.embed?`<button data-embed="${escape(v.embed)}">Carregar vídeo de ${v.provider}</button>`:'<p>Publicação externa: abra no Instagram para visualizar.</p>'}<p><a href="${escape(v.url)}" target="_blank" rel="noopener noreferrer">Abrir publicação original</a></p><p>A reprodução depende da disponibilidade e das permissões do autor.</p></div>`:'<div class="empty">Vídeo ou publicação externa<br>Cole um link do YouTube, Vimeo ou Instagram no editor.</div>';}
if(b.type==='ad')body=`<aside class="ad"><small>Publicidade · exemplo sem anunciante real</small>${b.images?.length?photo(b.images[0]):''}<h3>${escape(b.adTitle)}</h3><p>${escape(b.adText)}</p>${url(b.url)?`<a class="action" style="background:${s.button};color:${s.buttonText}" href="${escape(url(b.url))}" target="_blank" rel="sponsored noopener noreferrer">${escape(b.adLabel)}</a>`:'<p>Defina o destino do anúncio para habilitar seu botão.</p>'}</aside>`;
return `<div class="block" data-block="${b.id}">${b.title?'<h2>'+escape(b.title)+'</h2>':''}${body}</div>`;}
let lastSelection;let gallery=[],index=0;const dialog=document.getElementById('lightbox');function show(){const img=gallery[index];document.getElementById('large').src=innerWidth<640&&imageUrl(img.mobile)?imageUrl(img.mobile):imageUrl(img.desktop);document.getElementById('large').alt=img.alt||'Imagem ampliada';document.getElementById('imageCount').textContent=(index+1)+' / '+gallery.length;document.getElementById('prev').disabled=document.getElementById('next').disabled=gallery.length<2;}
document.getElementById('close').onclick=()=>dialog.close();document.getElementById('prev').onclick=()=>{index=(index-1+gallery.length)%gallery.length;show()};document.getElementById('next').onclick=()=>{index=(index+1)%gallery.length;show()};dialog.addEventListener('keydown',e=>{if(e.key==='ArrowRight')document.getElementById('next').click();if(e.key==='ArrowLeft')document.getElementById('prev').click()});
addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data.type!=='sections-preview')return;const state=e.data.state;document.getElementById('title').textContent=state.title;document.getElementById('sections').innerHTML=state.sections.map(s=>`<section data-section="${s.id}" data-width="${s.width}" class="section ${state.selected===s.id?'selected':''}" style="background:${s.bg};color:${s.text};--link:${s.link};text-align:${s.align};padding-top:${s.space}px;padding-bottom:${s.space}px;min-height:${s.height==='screen'?'100dvh':s.height==='custom'?Math.min(2000,Math.max(120,Number(s.pixels)||120))+'px':'0'}"><div class="content" style="max-width:${s.contentWidth==='reading'?'720px':s.contentWidth==='wide'?'1152px':'none'}">${s.blocks.length?s.blocks.map(b=>renderBlock(b,s)).join(''):'<p class="empty">Seção vazia. Adicione os conteúdos no editor.</p>'}</div></section>`).join('');document.querySelectorAll('[data-section]').forEach(el=>el.onclick=()=>parent.postMessage({type:'select-section',id:el.dataset.section},location.origin));document.querySelectorAll('[data-embed]').forEach(button=>button.onclick=e=>{e.stopPropagation();const iframe=document.createElement('iframe');iframe.className='embed';iframe.src=button.dataset.embed;iframe.title='Vídeo incorporado';iframe.allow='fullscreen; picture-in-picture';iframe.allowFullscreen=true;button.parentElement.replaceWith(iframe)});state.sections.forEach(s=>s.blocks.forEach(b=>{const el=document.querySelector(`[data-block="${b.id}"]`);el?.querySelectorAll('img').forEach((img,i)=>img.onclick=e=>{e.stopPropagation();gallery=b.images;index=i;show();dialog.showModal()});let slide=0;el?.querySelectorAll('[data-slide]').forEach(button=>button.onclick=e=>{e.stopPropagation();slide=(slide+Number(button.dataset.slide)+b.images.length)%b.images.length;el.querySelectorAll('.slide').forEach((node,i)=>node.hidden=i!==slide);el.querySelector('.slide-count').textContent=(slide+1)+' / '+b.images.length})}));document.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>e.stopPropagation()));const selection=state.selected+':'+state.selectedBlock;if(lastSelection!==undefined&&selection!==lastSelection){const target=document.querySelector(`[data-block="${state.selectedBlock}"]`)||document.querySelector(`[data-section="${state.selected}"]`);target?.scrollIntoView({block:'start'});}lastSelection=selection;});parent.postMessage({type:'post-ready'},location.origin);
</script></html>
